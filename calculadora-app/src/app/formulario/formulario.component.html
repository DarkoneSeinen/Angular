<form>
    <div class="form-grup">
      <label>Opernado A</label>
      <input type="number" class="form-control" placeholder=" escriba el primer operando" [(ngModel)]= "operandoA" name="operandoA"/>
    </div>

    <div class="form-grup">
      <label>Operando B</label>
      <input type="number" class="form-control" placeholder=" escriba el segundo operando" [(ngModel)]= "operandoB" name="operandoB"/>
    </div>

    <button class="alert alert-info" type="submit" class ="btn btn-primary" (click)="sumar()">Sumar</button>
  </form>
