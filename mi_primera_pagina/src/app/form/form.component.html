<div class="form-container">
    <h2>Formulario de Persona</h2>
    
    <!-- Campo para ID -->
    <label for="id">ID:</label>
    <input type="number" [(ngModel)]="id" placeholder="Ingresa el ID" id="id">
    
    <!-- Campo para nombre -->
    <label for="nombre">Nombre:</label>
    <input type="text" [(ngModel)]="nombre" placeholder="Ingresa el nombre" id="nombre">
    
    <!-- Campo para edad -->
    <label for="edad">Edad:</label>
    <input type="number" [(ngModel)]="edad" placeholder="Ingresa la edad" id="edad">
    
    <!-- Botón para agregar -->
    <button class="btn"(click)="agregarPersona()">Agregar</button>
    
    <!-- Mensaje -->
    <p>{{ mensaje }}</p>
  </div>
