
<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4 col-md-6 mx-auto">
    <h3 class="text-center">Suma</h3>

    <br/>

    <p-floatlabel>
      <input id="operandoA" pInputText type="number" [(ngModel)]="operandoA" />
      <label for="operandoA">Operando A</label>
    </p-floatlabel>

    <br/>

    <p-floatlabel>
      <input id="operandoB" pInputText type="number" [(ngModel)]="operandoB" />
      <label for="operandoB">Operando B</label>
    </p-floatlabel>

    <br />

    <!-- Botón PrimeNG -->
    <p-button label="Sumar" icon="pi pi-plus" (click)="sumar()"></p-button>

  </div>
</div>
