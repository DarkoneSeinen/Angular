<div class="container text-center">
  <h1 class="text-info">{{titulo}}</h1>

  <!--Links de login/ logout con bootstrap-->
  <div class="d-flex justify-content-center mb-3">
    @if(!isAutenticado()){
      <a [routerLink]="['/login']" class="btn btn-outline-primary mx-2">Login</a>
    }@else {
      <a style="cursor:pinter" class="btn btn-outline-danger mx-2" (click)="salir()">Logout</a>
    }
  </div>
  <router-outlet/>
</div>
