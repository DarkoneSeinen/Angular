<div class="container">
    <div class="row">
        <div class="col">
            <h1>Listado de personas</h1>
            <button class="btn btn-primary"  [disabled]="deshabilitar" (click)="agregarPersona()">Agregar Persona</button>
            <p *ngIf="mostrar; else sinPersona" >{{ mensaje }}</p>
            <ng-template #sinPersona>
                <p>No se ha agregado ninguna persona</p>
            </ng-template>

            <label>Titulo persona</label>
            <input type="text" class="form-control" [(ngModel)]='title'>
            {{title}}
        </div>
    </div>
</div>
