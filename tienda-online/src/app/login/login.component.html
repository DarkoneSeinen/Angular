<div class="conatiner d-flex justify-content-center align-items-center my-5">
  <div class="card p-4 shadow-sm" style="whidth:25rem ;">
    <h3 class="text-center mb-4">Iniciar sesion</h3>
    <form #f="ngForm" (ngSubmit)="f.form.valid && login(f)">
      <!--Campo de email-->
      <div class="mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder="Email"
        ngModel required/>
      </div>

      <!--Campo de contraseña-->
      <div class="mb-3">
        <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña"
        ngModel required/>
      </div>

      <!--Boton de iniciar sesion-->
      <button type="submit" class="btn btn-primary w-100">Iniciar sesion</button>


    </form>
  </div>

</div>
