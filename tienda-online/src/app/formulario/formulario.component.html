<h5 class="text-success mt-3">Agregar Nuevo producto</h5>

<form class="d-flex justify-content-between align-items-center my-4 w-50 mx-auto"
  (submit)="agregarProducto($event)">
  <input type="text" id="descripcion" name="descripción" placeholder="descripcion del producto" class="form-control me-2 w-75"
  autocomplete="off"
  [(ngModel)]="descripcionInput"/>

  <input type="number" id="precio" name="precio"
  placeholder="precio del producto" class="form-control me-2 w-25"
  [(ngModel)]="precioInput"/>

  <button type="submit" class="btn btn-primary" >
    Agregar
  </button>

</form>
