<div class="container mt-5">

  <div>
    <div class="d-flex justify-content-center">

      <div class="mb-3 d-flex align-items-center">
        <label for="operandoA" class="form-label me-2 text-nowrap">Operando A</label>
        <input type="number" class="form-control text-center" id="operandoA"
         [(ngModel)]="operandoA"
        />
      </div>
    </div>

    <div class="d-flex justify-content-center">
      <div class="mb-3 d-flex align-items-center">
        <label for="operandoB" class="form-label me-2 text-nowrap">Operando B</label>
        <input type="number" class="form-control text-center" id="operandoB"
         [(ngModel)]="operandoB"
        />
      </div>
    </div>

    <button class="btn btn-primary" (click)="sumar()">Sumar</button>
    <p class="text-center">Resulatdo: {{resultado}}</p>

  </div>

</div>
